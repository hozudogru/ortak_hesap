workflows:
  ios-workflow:
    name: "iOS Build"
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        provisioning_profiles:
           - ortakhesap-profile
        certificates:
            - ortakhesap-cert

    scripts:
      - name: "Get Flutter packages"
        script: |
          flutter pub get

      - name: "Install pods"
        script: |
          cd ios
          pod install
          cd ..

      - name: "Set up code signing"
        script: |
          xcode-project use-profiles

      - name: "Build signed IPA"
        script: |
          flutter build ipa --release --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration