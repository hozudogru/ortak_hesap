workflows:
  ios-workflow:
    name: "iOS Build"

    integrations:
      app_store_connect: Codemagic3

    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default

      # Otomatik imzalama: Codemagic, Codemagic3 App Store Connect anahtarıyla
      # oğlunuzun ekibinden (L8VSGNGQPG) dağıtım sertifikasını ve App Store
      # profilini kendisi alır/oluşturur. Eski ekibe ait ortakhesap-cert /
      # ortakhesap-profile kullanılmıyor.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hasimozudogru.ortakhesap

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod repo update
          pod install

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Flutter build iOS
        script: |
          flutter build ios --release --no-codesign

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-workflow:
    name: "Android Build"
    # Linux makinesi: Mac mini kuyrugundan bagimsiz, hemen baslar.
    instance_type: linux_x2
    max_build_duration: 60

    environment:
      flutter: 3.47.9
      groups:
        - default
      android_signing:
        - Ortak_Hesap_Takip

    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_KEYSTORE_PATH

      - name: Build AAB
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab

    publishing:
      google_play:
        credentials: $GPLAY_SERVICE_ACCOUNT_JSON
        track: production
        