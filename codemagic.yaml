workflows:
  ios-workflow:
    name: "iOS Build"
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: "Get Flutter packages"
        script: |
          flutter pub get

      - name: "Install pods"
        script: |
          cd ios
          pod install
          cd ..

      - name: "Set up code signing"
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.hasimozudogru.ortakhesap --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: "Build signed IPA"
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration