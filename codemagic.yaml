workflows:
  ios-workflow:
    name: "iOS Build"
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: "Get Flutter packages"
        script: |
          flutter pub get

      - name: "Install pods"
        script: |
          cd ios
          pod install
          cd ..

      - name: "Set up code signing"
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.hasimozudogru.ortakhesap --type IOS_APP_STORE --create --platform IOS
          keychain add-certificates
          xcode-project use-profiles

      - name: "Build signed IPA"
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner \
            --archive-xcargs "CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=5Z27VBG353" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration